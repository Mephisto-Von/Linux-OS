name: Install test

# Drive the real Calamares UI in QEMU, install to a blank disk, boot the
# installed system, and verify it over the serial console.
#
# The workflow can be called by the ISO build (same-run artifact), dispatched
# manually with a build run ID, or pushed to while iterating on the harness
# (uses the newest successful Build ISO (hosted) run).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build ISO (hosted) run ID (blank = latest successful build)"
        required: false
        type: string
      branded:
        description: "Require Samurai branding on the installed system"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_id:
        description: "Run that holds the samurai-linux-iso artifact"
        required: false
        type: string
      branded:
        description: "Require Samurai branding on the installed system"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - build/install-test.py
      - build/install-test.sh
      - .github/workflows/install-test.yml

permissions:
  contents: read
  actions: read

jobs:
  install:
    name: Install ISO to disk
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CALL_RUN_ID: ${{ inputs.run_id }}
      DISPATCH_RUN_ID: ${{ github.event.inputs.run_id }}
      EXPECT_BRANDING: ${{ inputs.branded }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v5

      - name: Resolve the ISO build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${CALL_RUN_ID:-${DISPATCH_RUN_ID:-}}"
          if [[ -z "$run_id" ]]; then
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-iso-hosted.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
          fi
          [[ -n "$run_id" && "$run_id" != "null" ]] || {
            echo "No successful Build ISO (hosted) run found" >&2
            exit 1
          }
          echo "Using ISO artifact from run $run_id"
          echo "ISO_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: samurai-linux-iso
          path: dist
          run-id: ${{ env.ISO_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install QEMU, OCR, and VNC tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils tesseract-ocr python3-pil python3-venv
          python3 -m venv /tmp/vncvenv
          /tmp/vncvenv/bin/pip install --disable-pip-version-check vncdotool==1.4.2
          echo "/tmp/vncvenv/bin" >> "$GITHUB_PATH"
          /tmp/vncvenv/bin/vncdo --help >/dev/null

      - name: Show downloaded ISO
        run: ls -lh dist

      - name: Self-test the serial harness
        run: python3 build/install-test.py --self-test

      - name: Install ISO in QEMU
        run: |
          set -euo pipefail
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          test -n "$iso"
          args=()
          if [[ "${EXPECT_BRANDING:-false}" == "true" ]]; then
            args+=(--branded)
          fi
          bash build/install-test.sh "$iso" "${args[@]}"

      - name: Show install test log
        if: always()
        run: |
          if [ -f build/install-test/driver.log ]; then
            {
              echo '## Install test driver log'
              echo '```'
              tail -n 250 build/install-test/driver.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test-diagnostics
          path: |
            build/install-test/*.log
            build/install-test/*.txt
            build/install-test/*.png
          if-no-files-found: warn
          retention-days: 7
